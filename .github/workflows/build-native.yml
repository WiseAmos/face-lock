name: Build native module

# Build the Rust + napi-rs `face-lock-camera` module for every platform
# we ship, on every push to main and on tagged releases.
#
# For pushes to main: build each target, run the JS test suite against
# the resulting binary (when a runner can host the target's Node + arch),
# and upload the .node binary as a workflow artifact.
#
# For tag pushes (v*): same build + test, but additionally attach the
# binaries to the GitHub release for that tag.
#
# Targets mirror `napi.targets` in crates/face-lock-camera/package.json.
# Adding a new target = adding it to package.json AND to the matrix below.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.editorconfig'
  pull_request:
    paths-ignore:
      - '**.md'

env:
  DEBUG: 'napi:*'
  RUST_BACKTRACE: '1'

concurrency:
  group: build-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Rust + JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: npm ci
      - run: cd crates/face-lock-camera && cargo fmt -- --check
      - run: cd crates/face-lock-camera && cargo clippy -- -D warnings
      - run: npm test

  build:
    name: Build (${{ matrix.target }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            node: '22'
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            node: '22'
          - target: x86_64-apple-darwin
            os: macos-14
            node: '22'
          - target: aarch64-apple-darwin
            os: macos-14
            node: '22'
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            node: '22'
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            node: '22'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/face-lock-camera -> target
      - name: Install crate deps
        run: npm install
        working-directory: crates/face-lock-camera
      - name: Build native module
        working-directory: crates/face-lock-camera
        run: npx --yes @napi-rs/cli@^2.18.0 build --platform --release --strip --js index.js --dts index.d.ts
      - name: List built binaries
        working-directory: crates/face-lock-camera
        run: ls -lh index.*.node || dir index.*.node
      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: crates/face-lock-camera/index.*.node
          if-no-files-found: error
          retention-days: 14

  test-binding:
    # Smoke-test the built .node binary by requiring it from Node and
    # calling listDevices(). Skipped on targets we can't host on GH
    # runners (aarch64-pc-windows-msvc needs windows-11-arm; we run it
    # on the linux-arm64 box for parity since the JS test surface is
    # platform-agnostic at the bind level).
    name: Test binding (${{ matrix.target }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            node: '22'
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            node: '22'
          - target: x86_64-apple-darwin
            os: macos-14
            node: '22'
          - target: aarch64-apple-darwin
            os: macos-14
            node: '22'
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            node: '22'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install root deps
        run: npm ci
      - name: Download built binary
        uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: node_modules/face-lock-camera/
      - name: Verify native module loads + listDevices returns array
        run: |
          node -e "
            const cam = require('face-lock-camera');
            if (typeof cam.listDevices !== 'function') throw new Error('listDevices missing');
            if (typeof cam.tryOpen !== 'function') throw new Error('tryOpen missing');
            if (typeof cam.Camera !== 'function') throw new Error('Camera class missing');
            const devs = cam.listDevices();
            if (!Array.isArray(devs)) throw new Error('listDevices did not return array');
            console.log('OK: ' + devs.length + ' device(s) enumerated');
            // tryOpen on missing device should return null (graceful)
            const h = cam.tryOpen(0, 320, 240);
            if (h !== null) { try { h.close(); } catch (_) {} }
            console.log('OK: tryOpen returned ' + (h === null ? 'null (no device, expected)' : 'a handle'));
          "
      - name: Run full JS test suite against built binary
        run: npm test

  publish-release-assets:
    # When a tag like v0.2.0 is pushed, take the per-platform binaries
    # built by the matrix and attach them to the GitHub release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: /tmp/native-${{ matrix.target }}/
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/native-${{ matrix.target }}/index.*.node
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
